# ============================================================================
#  zephyrus-price-tracker configuration
#  Every value below is a default -- delete anything you don't want to change.
# ============================================================================

[bestbuy]
# Free key, issued instantly: https://developer.bestbuy.com/
# Leave blank here and use the BESTBUY_API_KEY env var instead if you'd rather
# keep the key out of the file (recommended if you commit this anywhere).
api_key = ""
requests_per_second = 4        # Best Buy tolerates ~5/sec; stay under it
timeout_seconds = 30
max_retries = 4


# ---------------------------------------------------------------------------
#  Where the data comes from.
#
#  "feeds"   -- public deal feeds (Slickdeals and any RSS you add). No account,
#               no key, works immediately. Sees deals people POST, not Best Buy
#               inventory, and carries no store-level data at all.
#  "bestbuy" -- the official Best Buy API. Much better data, including per-store
#               Boston pickup stock, but Best Buy will not issue API keys to
#               free email providers (gmail, outlook, .edu ...).
# ---------------------------------------------------------------------------
[source]
backend = "feeds"


[feeds]
# Feed search is fuzzy and each query returns a different slice, so several
# narrow queries beat one broad one.
queries = [
    "zephyrus",
    "rog zephyrus g14",
    "rog zephyrus g16",
    "zephyrus open box",
]

# Any extra RSS/Atom feed URLs to merge in. For example a subreddit search:
#   urls = ["https://www.reddit.com/r/buildapcsales/search.rss?q=zephyrus&restrict_sr=1&sort=new"]
urls = []

# Only alert on these retailers. Empty = any. Note that a posting whose
# retailer cannot be identified is dropped when this filter is set.
retailers = []

require_price = true     # skip postings with no parseable price
max_age_days  = 180      # how far back to record; the first scan is silent

# Feed SEARCH returns postings that expired months ago -- in practice most of
# what comes back is already dead -- so liveness is checked at the source
# rather than assumed. Expiry is one-way: a deal is only checked until it
# expires, after which it is never re-checked, so the steady-state cost is
# just new and still-live postings.
check_liveness           = true
liveness_checks_per_scan = 25   # cap the per-scan request budget
liveness_recheck_hours   = 8    # how often to re-confirm a still-live deal

# No retailer allows an automated stock check without its API, so an old
# posting the source has not marked dead is genuinely unknown rather than
# in stock. Past this age it is reported as "unverified", not "available".
stale_after_days         = 30


[search]
# One Products API query per term; results are merged and de-duplicated.
terms = ["zephyrus"]
manufacturer = "asus"

# A product must contain one of these in its name...
include_keywords = ["zephyrus"]

# ...and none of these (kills sleeves, chargers, warranties and mice).
exclude_keywords = [
    "case", "sleeve", "backpack", "bag", "charger", "adapter", "dock",
    "warranty", "protection", "mouse", "keyboard", "headset", "cable",
]

# Optional: restrict to specific model families. Empty = every Zephyrus.
# e.g. models = ["G14", "G16"]
models = []


[location]
postal_code = "02108"          # downtown Boston
radius_miles = 25              # covers Cambridge, Watertown, Dorchester,
                               # Everett, Saugus, Dedham, Braintree, Framingham
# Optional: pin to specific stores instead of everything in the radius.
# Run `zephyrus stores` to see IDs, then e.g. store_ids = ["1497", "1416"]
store_ids = []

# Optional: only these cities count as "near Boston".
# e.g. city_allowlist = ["Cambridge", "Watertown", "Boston"]
city_allowlist = []


# Discounts are measured against the regular LIST price, so a sale and an
# open-box markdown stack on top of each other. Best Buy open-box Excellent is
# routinely ~10% off by itself, which is why the open-box bar sits ABOVE the
# new-unit bar -- set it lower and essentially every open-box listing alerts.
#
# Restock alerts do NOT use these numbers: an open-box unit coming back in
# stock always alerts, however modest its discount.
[thresholds]
heavy_discount_pct    = 20.0   # % off list before a NEW unit counts as a deal
open_box_discount_pct = 25.0   # open-box / refurbished start discounted already
price_drop_pct        = 5.0    # drop vs the last observed price...
price_drop_dollars    = 100.0  # ...or this many dollars, whichever hits first
min_drop_dollars      = 40.0   # ignore moves smaller than this entirely
alert_on_all_time_low = true   # tell me when it beats every price I've recorded
alert_on_new_product  = true   # tell me when a new Zephyrus SKU shows up
max_price             = 0      # 0 = no cap. Set e.g. 1800 to mute pricier units.


[alerts]
cooldown_hours      = 24       # don't repeat an identical alert within a day
include_unavailable = false    # alert on price changes for out-of-stock items
max_per_scan        = 12       # cap a flood; 0 = unlimited


[storage]
database = "zephyrus.db"


# ---------------------------------------------------------------------------
#  Notification channels -- enable as many as you like.
# ---------------------------------------------------------------------------

[notify.console]
enabled = true

[notify.file]
enabled = true
path = "alerts.jsonl"

# Phone push with no account and no app signup: pick an unguessable topic
# name, install the ntfy app, subscribe to that topic. This is the easiest
# way to get real-time alerts on your phone.
[notify.ntfy]
enabled = false
server  = "https://ntfy.sh"
topic   = ""                   # e.g. "zephyrus-bos-7f3a91" -- keep it private
token   = ""                   # only for self-hosted / reserved topics

# Gmail: turn on 2FA, then create an App Password
# (https://myaccount.google.com/apppasswords) and use that as `password`.
[notify.email]
enabled   = false
smtp_host = "smtp.gmail.com"
smtp_port = 587
use_ssl   = false              # true if you use port 465
username  = ""
password  = ""                 # or set ZEPHYRUS_SMTP_PASSWORD in the env
from_addr = ""                 # defaults to username
to_addrs  = []                 # e.g. ["you@example.com"]

# Slack and Discord webhook URLs are auto-detected and formatted; any other
# URL receives the raw JSON payload.
[notify.webhook]
enabled = false
url     = ""
