# The test suite runs against a scripted fake Best Buy client, so CI needs no
# API key, no network and no dependencies.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib); 3.12 is what the scan workflow runs.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check the CLI starts and config validates
        run: |
          python -m zephyrus_tracker --version
          python -m zephyrus_tracker init
          python -m zephyrus_tracker report
