# Run the tracker on GitHub's machines -- no always-on computer needed.
#
# This runs out of the box on the "feeds" backend, which needs NO credentials.
#
# SETUP:
#   1. Settings > Secrets and variables > Actions > New repository secret:
#        ZEPHYRUS_NTFY_TOPIC    strongly recommended -- phone push via ntfy.sh
#        ZEPHYRUS_WEBHOOK_URL   optional -- Slack / Discord / generic webhook
#        ZEPHYRUS_SMTP_PASSWORD optional -- only if you enable notify.email
#        BESTBUY_API_KEY        ONLY for the "bestbuy" backend
#   2. Actions tab > enable workflows if prompted.
#   3. Run it once by hand: Actions > "Zephyrus price scan" > Run workflow.
#
# To switch to the official Best Buy API once you have a key, add a repository
# VARIABLE (not a secret) named ZEPHYRUS_BACKEND with the value "bestbuy", and
# add the BESTBUY_API_KEY secret.
#
# Price history lives in the Actions cache between runs. Each run saves a new
# entry and restores the newest previous one, so the SQLite DB carries forward.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no commits to
# the repository. If alerts go quiet for a long stretch, check the Actions tab
# for a "this workflow was disabled" banner and re-enable it.
name: Zephyrus price scan

on:
  schedule:
    # Every 30 minutes, 11:00-03:59 UTC. That is roughly 7am-11pm Eastern in
    # summer (EDT) and 6am-10pm in winter (EST) -- cron has no timezone, so the
    # window shifts an hour with daylight saving. Widen it if you care.
    - cron: "*/30 11-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert instead of scanning (checks ntfy/webhook/email)"
        type: boolean
        default: false

concurrency:
  group: zephyrus-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # restore-keys picks up the newest zephyrus-db-* entry from a prior run.
      - name: Restore price history
        uses: actions/cache/restore@v5
        with:
          path: zephyrus.db
          key: zephyrus-db-${{ github.run_id }}
          restore-keys: zephyrus-db-

      # Without this guard every scheduled run fails until the secret exists,
      # and GitHub emails on each one -- ~48 failure mails a day.
      # The feeds backend needs no credentials, so only the bestbuy backend can
      # be unconfigured. Failing every half hour would otherwise mail you ~48
      # times a day.
      - name: Check configuration
        id: guard
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          ZEPHYRUS_BACKEND: ${{ vars.ZEPHYRUS_BACKEND }}
        run: |
          backend="${ZEPHYRUS_BACKEND:-feeds}"
          if [ "$backend" = "bestbuy" ] && [ -z "$BESTBUY_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Scan skipped"
              echo ""
              echo "The backend is set to \`bestbuy\` but \`BESTBUY_API_KEY\` is not set."
              echo ""
              echo "Either add the secret under **Settings > Secrets and variables >"
              echo "Actions**, or remove the \`ZEPHYRUS_BACKEND\` variable to fall back"
              echo "to the credential-free deal feeds."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::backend=bestbuy but no API key; skipping the scan."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::running the $backend backend."
          fi

      - name: Send test alert
        if: inputs.test_alert
        env:
          ZEPHYRUS_NTFY_TOPIC: ${{ secrets.ZEPHYRUS_NTFY_TOPIC }}
          ZEPHYRUS_WEBHOOK_URL: ${{ secrets.ZEPHYRUS_WEBHOOK_URL }}
          ZEPHYRUS_SMTP_PASSWORD: ${{ secrets.ZEPHYRUS_SMTP_PASSWORD }}
        run: |
          if [ -z "$ZEPHYRUS_NTFY_TOPIC" ] && [ -z "$ZEPHYRUS_WEBHOOK_URL" ]; then
            echo "::error::No notification secret is set, so a test alert can only"
            echo "::error::reach the console. Add ZEPHYRUS_NTFY_TOPIC first."
            exit 1
          fi
          python -m zephyrus_tracker test-alert

      - name: Scan
        if: steps.guard.outputs.configured == 'true' && !inputs.test_alert
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          ZEPHYRUS_BACKEND: ${{ vars.ZEPHYRUS_BACKEND }}
          ZEPHYRUS_NTFY_TOPIC: ${{ secrets.ZEPHYRUS_NTFY_TOPIC }}
          ZEPHYRUS_WEBHOOK_URL: ${{ secrets.ZEPHYRUS_WEBHOOK_URL }}
          ZEPHYRUS_SMTP_PASSWORD: ${{ secrets.ZEPHYRUS_SMTP_PASSWORD }}
        run: python -m zephyrus_tracker scan

      # Save first, so a failure in report generation never costs you history.
      - name: Save price history
        if: always() && steps.guard.outputs.configured == 'true' && !inputs.test_alert
        uses: actions/cache/save@v5
        with:
          path: zephyrus.db
          key: zephyrus-db-${{ github.run_id }}

      - name: Build HTML report
        if: always() && steps.guard.outputs.configured == 'true' && !inputs.test_alert
        run: python -m zephyrus_tracker report --html report.html

      # Download this from the run's summary page to see current prices and
      # full history without cloning anything.
      - name: Upload report
        if: always() && steps.guard.outputs.configured == 'true' && !inputs.test_alert
        uses: actions/upload-artifact@v6
        with:
          name: zephyrus-report
          path: report.html
          retention-days: 14

      - name: Summary
        if: always() && steps.guard.outputs.configured == 'true' && !inputs.test_alert
        run: |
          {
            echo "### Zephyrus scan"
            echo ""
            python -m zephyrus_tracker report | head -60
          } >> "$GITHUB_STEP_SUMMARY"
