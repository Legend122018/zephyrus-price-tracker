[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrus-price-tracker"
version = "1.0.0"
description = "Track Best Buy pricing and open-box stock for ASUS ROG Zephyrus laptops around Boston"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []          # stdlib only, by design

[project.scripts]
zephyrus = "zephyrus_tracker.cli:main"

[tool.setuptools]
packages = ["zephyrus_tracker"]

[tool.setuptools.package-data]
zephyrus_tracker = ["config.example.toml"]
